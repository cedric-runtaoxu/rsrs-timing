[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsrs-timing"
version = "0.4.0"
description = "按光大2017年研报章节、32图10表复现RSRS市场择时"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cedric XU" }]
keywords = ["quantitative-finance", "market-timing", "RSRS", "factor", "backtest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# 基础指标依赖numpy/pandas；完整研究另需统计与绘图库
plot = ["matplotlib>=3.7"]
research = ["matplotlib>=3.7", "statsmodels>=0.14", "scipy>=1.11"]

[tool.setuptools]
packages = ["rsrs"]

[tool.pytest.ini_options]
# 单元测试不依赖 pytest，可直接运行：python tests/test_rsrs.py
testpaths = ["tests"]
