name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: 单元测试
        run: python tests/test_rsrs.py

      - name: 复现质量自检
        # 逐项比对原报告公开数值；核心项（表 2/表 4）通过率低于 95% 时返回非零
        run: python check_replication.py --dry-run

      - name: 残差诊断（仅输出，不判定）
        run: python diagnose_parameters.py
