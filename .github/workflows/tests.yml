name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 中文绘图字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 单元测试
        run: |
          python tests/test_rsrs.py
          python tests/test_research.py
          python tests/test_paper.py
          python tests/test_improvement.py

      - name: 原研报逐项复现
        run: |
          python paper.py
          python check_replication.py

      - name: 失效诊断与改进研究
        run: |
          python improve.py
          python check_improvement.py
